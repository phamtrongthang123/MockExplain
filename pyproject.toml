[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mockexplain"
version = "0.1.0"
description = "A meta study in a software form: inspect model weights and architecture to suggest interpretability methods."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Trong Thang Pham", email = "phamtrongthang123@gmail.com" }
]
dependencies = []

[project.urls]
Homepage = "https://github.com/phamtrongthang123/MockExplain"
Repository = "https://github.com/phamtrongthang123/MockExplain"
Issues = "https://github.com/phamtrongthang123/MockExplain/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mockexplain*"]

[project.scripts]
mockexplain = "mockexplain.server:main"

[tool.setuptools.package-data]
mockexplain = ["static/*"]
