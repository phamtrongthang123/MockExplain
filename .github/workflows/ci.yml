name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  package-and-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: python -m pip install .
      - name: Verify dependency-free installed package and assets
        run: |
          cd /tmp
          python -I - <<'PY'
          import sys
          from importlib.resources import files
          import mockexplain
          heavy = {"torch", "transformers", "transformer_lens", "sae_lens", "numpy"}
          assert heavy.isdisjoint(sys.modules)
          assert files("mockexplain").joinpath("static/index.html").is_file()
          PY
      - name: Reader, rules, API, and switching checks
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/test_state.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mockexplain-browser
          path: /tmp/mockexplain-browser
