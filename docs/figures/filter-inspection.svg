<text x="25" y="30" class="small" text-anchor="start">CONVOLUTION AT ONE POSITION</text><rect x="20" y="80" width="155" height="95" rx="9" class="model"/><text x="97.5" y="103" class="title" text-anchor="middle">Input patch x</text><text x="97.5" y="127" class="num" text-anchor="middle">[ 1,  2,  3 ]</text><text x="97.5" y="147" class="small" text-anchor="middle">x₁   x₂   x₃</text><rect x="210" y="80" width="155" height="95" rx="9" class="model"/><text x="287.5" y="103" class="title" text-anchor="middle">Filter weights w</text><text x="287.5" y="127" class="num" text-anchor="middle">[ −1,  0,  1 ]</text><text x="287.5" y="147" class="small" text-anchor="middle">w₁   w₂   w₃</text><rect x="403" y="80" width="130" height="95" rx="9" class="method"/><text x="468.0" y="103" class="title" text-anchor="middle">Multiply + sum</text><text x="468.0" y="127" class="math" text-anchor="middle">Σ xᵢwᵢ</text><text x="468.0" y="147" class="small" text-anchor="middle">no bias</text><rect x="572" y="80" width="125" height="95" rx="9" class="model"/><text x="634.5" y="103" class="title" text-anchor="middle">One output y</text><text x="634.5" y="127" class="math" text-anchor="middle">2</text><text x="634.5" y="147" class="small" text-anchor="middle">feature map</text><path d="M175 127H195V58H468V78" class="line"/><path d="M365 127H401" class="line"/><path d="M533 127H570" class="line"/><text x="24" y="215" class="label" text-anchor="start">The same filter slides over the input to produce the rest of the feature map.</text></svg>