xt x="652.5" y="213" class="title" text-anchor="middle">Softmax</text><text x="652.5" y="237" class="math" text-anchor="middle">p<tspan baseline-shift="sub" font-size="75%">ℓ</tspan></text><path d="M160 227H213" class="line"/><path d="M365 227H418" class="line"/><path d="M555 227H603" class="line"/><path d="M90 123V188" class="line"/><path d="M652 123V151H290V188" class="line"/><path d="M615 122V165H488V188" class="line"/><text x="25" y="302" class="label" text-anchor="start">The lens applies the model’s final normalization and output head to h<tspan baseline-shift="sub" font-size="75%">ℓ</tspan>.</text><text x="25" y="324" class="small" text-anchor="start">p<tspan baseline-shift="sub" font-size="75%">ℓ</tspan> is a vocabulary distribution for the selected intermediate layer ℓ.</text></svg>