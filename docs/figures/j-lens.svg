chor="middle">W<tspan baseline-shift="sub" font-size="75%">U</tspan></text><rect x="585" y="190" width="115" height="80" rx="9" class="method"/><text x="642.5" y="213" class="title" text-anchor="middle">Ranked</text><text x="642.5" y="237" class="small" text-anchor="middle">token scores</text><path d="M155 230H208" class="line"/><path d="M355 230H408" class="line"/><path d="M540 230H583" class="line"/><path d="M86 124V188" class="line"/><path d="M282 124V188" class="grad"/><path d="M642 124V150H475V188" class="line"/><text x="25" y="307" class="label" text-anchor="start">J<tspan baseline-shift="sub" font-size="75%">ℓ</tspan> is fitted by averaging ∂h<tspan baseline-shift="sub" font-size="75%">final</tspan> / ∂h<tspan baseline-shift="sub" font-size="75%">ℓ</tspan> over a corpus and positions.</text><text x="25" y="329" class="small" text-anchor="start">The dashed connection represents fitting; the readout reuses the model’s output head.</text></svg>