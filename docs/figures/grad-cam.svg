<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#789488"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b97934"/></marker></defs>
<rect x="0.5" y="0.5" width="719" height="353" rx="14" fill="#f7faf8" stroke="#dce8e0"/>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#14251c} .label{font-size:14px;fill:#52685c} .small{font-size:12px;fill:#647970} .title{font-size:15px;font-weight:700} .math{font-family:Georgia,serif;font-size:21px;font-style:italic;font-weight:600} .num{font-family:ui-monospace,monospace;font-size:17px;font-weight:700} .method{fill:#e6f6ed;stroke:#9ad5b3} .model{fill:#fff;stroke:#cbded1} .warm{fill:#fff7eb;stroke:#e7c597} .group{fill:none;stroke:#cbded1;stroke-dasharray:5 5} .line{fill:none;stroke:#789488;stroke-width:2;marker-end:url(#arrow)} .grad{fill:none;stroke:#b97934;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#orange)}</style>
<text x="25" y="28" class="small" text-anchor="start">MODEL FORWARD PASS</text><rect x="20" y="45" width="110" height="70" rx="9" class="model"/><text x="75.0" y="68" class="title" text-anchor="middle">Image</text><text x="75.0" y="92" class="small" text-anchor="middle">input</text><rect x="155" y="45" width="115" height="70" rx="9" class="model"/><text x="212.5" y="68" class="title" text-anchor="middle">CNN</text><text x="212.5" y="92" class="small" text-anchor="middle">convolutions</text><rect x="295" y="45" width="120" height="70" rx="9" class="model"/><text x="355.0" y="68" class="title" text-anchor="middle">Maps Aᵏ</text><text x="355.0" y="92" class="small" text-anchor="middle">k = channel</text><rect x="440" y="45" width="110" height="70" rx="9" class="model"/><text x="495.0" y="68" class="title" text-anchor="middle">Rest of CNN</text><text x="495.0" y="92" class="small" text-anchor="middle">later layers</text><rect x="575" y="45" width="125" height="70" rx="9" class="model"/><text x="637.5" y="68" class="title" text-anchor="middle">Score yᶜ</text><text x="637.5" y="92" class="small" text-anchor="middle">target class c</text><path d="M130 80H153" class="line"/><path d="M270 80H293" class="line"/><path d="M415 80H438" class="line"/><path d="M550 80H573" class="line"/><text x="25" y="170" class="small" text-anchor="start">GRAD-CAM READOUT</text><rect x="20" y="185" width="190" height="88" rx="9" class="warm"/><text x="115.0" y="208" class="title" text-anchor="middle">Gradient</text><text x="115.0" y="232" class="math" text-anchor="middle">∂yᶜ / ∂Aᵏᵢⱼ</text><text x="115.0" y="252" class="small" text-anchor="middle">for each position i, j</text><rect x="257" y="185" width="180" height="88" rx="9" class="method"/><text x="347.0" y="208" class="title" text-anchor="middle">Average over Z</text><text x="347.0" y="232" class="math" text-anchor="middle">αₖ</text><text x="347.0" y="252" class="small" text-anchor="middle">one weight per map</text><rect x="490" y="185" width="210" height="88" rx="9" class="method"/><text x="595.0" y="208" class="title" text-anchor="middle">Weighted maps + ReLU</text><text x="595.0" y="232" class="math" text-anchor="middle">heatmap Lᶜ</text><text x="595.0" y="252" class="small" text-anchor="middle">Σₖ αₖ Aᵏ</text><path d="M210 229H255" class="line"/><path d="M437 229H488" class="line"/><path d="M638 116V143H115V183" class="grad"/><path d="M355 116V167H595V183" class="line"/><text x="25" y="307" class="label" text-anchor="start">Dashed arrow: backpropagate from yᶜ to the selected feature maps.</text><text x="25" y="330" class="small" text-anchor="start">Z counts spatial positions in each map; Lᶜ is the heatmap for class c.</text></svg>