<text x="25" y="30" class="small" text-anchor="start">ONE SIMPLIFIED LAYER</text><rect x="20" y="85" width="130" height="93" rx="9" class="model"/><text x="85.0" y="108" class="title" text-anchor="middle">Layer input</text><text x="85.0" y="132" class="math" text-anchor="middle">x</text><rect x="190" y="85" width="150" height="93" rx="9" class="model"/><text x="265.0" y="108" class="title" text-anchor="middle">Affine step</text><text x="265.0" y="132" class="math" text-anchor="middle">Wx + b</text><text x="265.0" y="152" class="small" text-anchor="middle">weights W, bias b</text><rect x="380" y="85" width="135" height="93" rx="9" class="method"/><text x="447.5" y="108" class="title" text-anchor="middle">ReLU</text><text x="447.5" y="132" class="math" text-anchor="middle">max(0, ·)</text><rect x="555" y="85" width="145" height="93" rx="9" class="model"/><text x="627.5" y="108" class="title" text-anchor="middle">Activation</text><text x="627.5" y="132" class="math" text-anchor="middle">h</text><text x="627.5" y="152" class="small" text-anchor="middle">layer output</text><path d="M150 131H188" class="line"/><path d="M340 131H378" class="line"/><path d="M515 131H553" class="line"/><text x="25" y="220" class="label" text-anchor="start">Example: pre-ReLU [−1, 2] becomes h = [0, 2].</text><text x="25" y="243" class="small" text-anchor="start">This is one illustrative layer; transformers contain other operations.</text></svg>